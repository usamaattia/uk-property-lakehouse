[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-property-lakehouse"
version = "0.1.0"
description = "Medallion lakehouse for HM Land Registry Price Paid Data: ingest -> dbt (bronze/silver/gold) on DuckDB or Databricks -> public dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Osama Al-Attia" }]
dependencies = [
  "httpx>=0.27",
  "duckdb>=1.1",
  "dbt-core>=1.10,<2",
  "dbt-duckdb>=1.10",
]

[project.optional-dependencies]
databricks = ["dbt-databricks>=1.9", "databricks-sdk>=0.30"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lakehouse = "lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
