# Builds the lakehouse from real HM Land Registry data and publishes the dashboard to
# GitHub Pages. One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Publish dashboard

on:
  schedule:
    # Monthly update lands around the 20th working day; build on the 26th.
    - cron: "0 7 26 * *"
  workflow_dispatch:
    inputs:
      synthetic:
        description: "Use synthetic demo data instead of downloading real data"
        type: boolean
        default: false
      backfill_years:
        description: "Years of history to build"
        default: "4"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Land data
        run: |
          if [ "${{ inputs.synthetic }}" = "true" ]; then
            lakehouse demo
          else
            lakehouse monthly --backfill-years "${{ inputs.backfill_years || '4' }}"
          fi
          lakehouse log
      - name: dbt build (bronze -> silver -> gold, with tests)
        run: dbt build --project-dir transform --profiles-dir transform
      - name: Export dashboard data
        run: lakehouse export-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
