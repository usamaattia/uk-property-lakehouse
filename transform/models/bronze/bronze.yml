version: 2

models:
  - name: bronze_ppd
    description: >
      Raw HM Land Registry Price Paid Data as landed. All columns are strings; lineage
      columns record which file and load each row came from.
    columns:
      - name: transaction_id
        data_tests: [not_null]
      - name: record_status
        description: A = added, C = changed, D = deleted (monthly update file only).
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'C', 'D']
      - name: _load_id
        description: Sortable UTC timestamp of the ingestion run (from the landing path).
        data_tests: [not_null]
      - name: _source_file
        data_tests: [not_null]
